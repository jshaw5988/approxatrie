[loggers]
keys=root,pat

[handlers]
keys=consoleHandler

[formatters]
keys=simpleFormatter

[logger_root]
level=DEBUG
handlers=consoleHandler

[logger_pat]
level=DEBUG
# level=WARNING
handlers=consoleHandler
qualname=pat
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=simpleFormatter
args=(sys.stderr,)

[formatter_simpleFormatter]
# format=%(name)s - %(levelname)s - %(funcName)s - %(message)s
format=%(name)s - %(levelname)s - %(message)s
datefmt=
